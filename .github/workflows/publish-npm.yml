name: Publish TypeScript SDK to npm

# Publishes plugins/typescript as @lictorate/agentguard when a GitHub release
# is published — the same trigger as publish-pypi.yml.
#
# Requires the repository secret NPM_TOKEN: a granular npm access token with
# publish rights on the @lictorate scope. `--provenance` links the published
# version to this workflow run, which needs `id-token: write`.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/typescript

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # A release tagged v1.2.3 must publish package.json version 1.2.3.
      # Catches a release cut before scripts/bump-version.sh was run.
      - name: Check package version matches the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "v${pkg}" != "${TAG}" ]; then
            echo "package.json version ${pkg} does not match release tag ${TAG}" >&2
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
